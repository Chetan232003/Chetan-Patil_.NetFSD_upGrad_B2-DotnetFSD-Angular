<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Manager</title>
    <style>
        #profile {
            border: 1px solid #333;
            padding: 10px;
            width: 250px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h2>Student Profile</h2>

    <div id="profile"></div>

    <button id="showProfileBtn">Show Profile</button>
    <button id="updateMarksBtn">Update Marks</button>

    <script>

        var student = {
            name: "Rahul",
            rollNo: 101,
            marks: 75
        };

        function updateStudentProfile(studentObj) {
            var profileDiv = document.getElementById("profile");

            profileDiv.innerHTML =
                "<p>Name: " + studentObj.name + "</p>" +
                "<p>Roll No: " + studentObj.rollNo + "</p>" +
                "<p>Marks: " + studentObj.marks + "</p>";
        }

        function updateMarks(newMarks) {
            student.marks = newMarks;
            updateStudentProfile(student);
        }

        document.getElementById("showProfileBtn")
            .addEventListener("click", function () {
                updateStudentProfile(student);
            });

        document.getElementById("updateMarksBtn")
            .addEventListener("click", function () {
                updateMarks(95);
            });
    </script>

</body>
</html>
