<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upgrad Events - Manage Events</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Events Management</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link active" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="fw-bold mb-0">Manage Events</h1>
      <button class="btn btn-danger" id="logoutBtn">Logout</button>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h3 class="mb-3">Add Event</h3>
        <form id="addEventForm" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <input type="number" class="form-control" id="eventId" placeholder="Event ID" required />
            </div>
            <div class="col-md-6">
              <input type="text" class="form-control" id="eventName" placeholder="Event Name" required />
            </div>
            <div class="col-md-6">
              <select class="form-select" id="eventCategory" required>
                <option value="">Select Category</option>
                <option value="Tech & Innovations">Tech & Innovations</option>
                <option value="Industrial Event">Industrial Event</option>
              </select>
            </div>
            <div class="col-md-6">
              <input type="date" class="form-control" id="eventDate" required />
            </div>
            <div class="col-md-6">
              <input type="time" class="form-control" id="eventTime" required />
            </div>
            <div class="col-md-6">
              <input type="url" class="form-control" id="eventUrl" placeholder="Event URL" required />
            </div>
          </div>

          <div class="mt-3">
            <button type="submit" class="btn btn-success">Add Event</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h3 class="mb-3">Search Event</h3>
        <form id="searchForm">
          <div class="row g-3">
            <div class="col-md-4">
              <select class="form-select" id="searchType">
                <option value="id">ID</option>
                <option value="name">Name</option>
                <option value="category">Category</option>
              </select>
            </div>
            <div class="col-md-4">
              <input type="text" class="form-control" id="searchValue" placeholder="Enter search value" />
            </div>
            <div class="col-md-4">
              <button type="submit" class="btn btn-primary w-100">Search</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="row g-4" id="eventsContainer"></div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/events.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async function () {
      protectEventsPage();
      setupLogout();
      await renderEvents();
      setupAddEventForm();
      setupSearchForm();
    });
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
