<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upgrad Events - Event Registration</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="index.html">Events Management</a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#mainNavbar"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="mainNavbar">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact Us</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <h1 class="fw-bold mb-4">Event Registration</h1>

    <div class="card mb-4 shadow-sm">
      <div class="card-body" id="eventDetails"></div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <h3 class="mb-3">Participant Details</h3>

        <form id="registrationForm" novalidate>
          <div class="mb-3">
            <input type="text" class="form-control" id="firstName" placeholder="First Name" required />
          </div>

          <div class="mb-3">
            <input type="text" class="form-control" id="lastName" placeholder="Last Name" required />
          </div>

          <div class="mb-3">
            <input type="email" class="form-control" id="participantEmail" placeholder="Email" required />
          </div>

          <button type="submit" class="btn btn-success">Register</button>
        </form>
      </div>
    </div>
  </main>

  <script src="js/db.js"></script>
  <script src="js/register.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      loadEventDetails();
      setupRegistrationForm();
    });
  </script>
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
  ></script>
</body>
</html>
