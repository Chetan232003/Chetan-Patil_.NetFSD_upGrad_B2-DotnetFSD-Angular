<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Landing Page</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">ShopNow</a>
      <button class="navbar-toggler" data-bs-toggle="offcanvas" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
  </nav>

  <div class="offcanvas offcanvas-start" id="menu">
    <div class="offcanvas-header">
      <h5>Menu</h5>
      <button class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <a href="#" class="d-block mb-2">Home</a>
      <a href="#" class="d-block mb-2">Products</a>
      <a href="#" class="d-block mb-2">Contact</a>
    </div>
  </div>

  <section class="bg-light text-center py-5">
    <div class="container">
      <h1 class="fw-bold">Welcome to ShopNow</h1>
      <p class="lead">Best deals on electronics and accessories</p>
      <button class="btn btn-primary">Shop Now</button>
    </div>
  </section>

  <div id="productCarousel" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">

      <div class="carousel-item active">
        <img src="https://via.placeholder.com/1200x400" class="d-block w-100" alt="Product">
      </div>

      <div class="carousel-item">
        <img src="https://via.placeholder.com/1200x400" class="d-block w-100" alt="Product">
      </div>

      <div class="carousel-item">
        <img src="https://via.placeholder.com/1200x400" class="d-block w-100" alt="Product">
      </div>

    </div>

    <button class="carousel-control-prev" data-bs-target="#productCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" data-bs-target="#productCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <section class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Featured Products</h2>

      <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300x200" class="card-img-top">
            <div class="card-body text-center">
              <h5>Smartphone</h5>
              <button class="btn btn-primary w-100">Buy Now</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300x200" class="card-img-top">
            <div class="card-body text-center">
              <h5>Laptop</h5>
              <button class="btn btn-primary w-100">Buy Now</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300x200" class="card-img-top">
            <div class="card-body text-center">
              <h5>Headphones</h5>
              <button class="btn btn-primary w-100">Buy Now</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-md-6 col-lg-3">
          <div class="card h-100">
            <img src="https://via.placeholder.com/300x200" class="card-img-top">
            <div class="card-body text-center">
              <h5>Smart Watch</h5>
              <button class="btn btn-primary w-100">Buy Now</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="bg-dark text-white py-5">
    <div class="container text-center">
      <h3>Subscribe to Newsletter</h3>
      <form class="row justify-content-center mt-3">
        <div class="col-12 col-md-6">
          <input type="email" class="form-control" placeholder="Enter your email">
        </div>
        <div class="col-12 col-md-2 mt-2 mt-md-0">
          <button class="btn btn-primary w-100">Subscribe</button>
        </div>
      </form>
    </div>
  </section>

 
  <footer class="text-center py-3 bg-light">
    <p class="mb-0">© 2026 ShopNow. All rights reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
