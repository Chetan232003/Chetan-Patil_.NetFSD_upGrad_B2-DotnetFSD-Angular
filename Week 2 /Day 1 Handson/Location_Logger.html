<!DOCTYPE html>
<html>
<head>
    <title>Location Logger</title>
</head>
<body onload="loadHistory()">

    <h2>My Location Logger</h2>

    <button onclick="getLocation()">Get My Location</button>

    <p id="output"></p>

    <h3>Last 5 Locations</h3>
    <ul id="history"></ul>

    <script>
        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, error);
            } else {
                document.getElementById("output").innerText = "Geolocation not supported.";
            }
        }

        function success(position) {
            let lat = position.coords.latitude;
            let lon = position.coords.longitude;

            document.getElementById("output").innerText =
                "Latitude: " + lat + " | Longitude: " + lon;

            let locations = JSON.parse(localStorage.getItem("locations")) || [];

            locations.unshift({ latitude: lat, longitude: lon });

            if (locations.length > 5) {
                locations.pop();
            }

            localStorage.setItem("locations", JSON.stringify(locations));
            loadHistory();
        }

        function error(err) {
            let message = "";
            switch (err.code) {
                case err.PERMISSION_DENIED:
                    message = "Permission denied.";
                    break;
                case err.POSITION_UNAVAILABLE:
                    message = "Location unavailable.";
                    break;
                case err.TIMEOUT:
                    message = "Request timeout.";
                    break;
                default:
                    message = "Unknown error.";
            }
            document.getElementById("output").innerText = message;
        }

        function loadHistory() {
            let locations = JSON.parse(localStorage.getItem("locations")) || [];
            let list = document.getElementById("history");
            list.innerHTML = "";

            locations.forEach(loc => {
                let li = document.createElement("li");
                li.innerText = "Lat: " + loc.latitude + ", Lon: " + loc.longitude;
                list.appendChild(li);
            });
        }
    </script>

</body>
</html>
