<!DOCTYPE html>
<html>
<head>
    <title>Mini Product Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 8px;
            width: 250px;
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 10px;
            margin: 5px auto;
            width: 300px;
            background: #f4f4f4;
        }

        .no-result {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Product Search</h2>
    <input type="text" id="searchInput" placeholder="Search products...">

    <ul id="productList"></ul>
    <p id="noResultMessage" class="no-result"></p>

    <script>
        const products = [
            "Laptop",
            "Mobile Phone",
            "Headphones",
            "Smart Watch",
            "Keyboard",
            "Mouse",
            "Tablet",
            "Camera"
        ];

        const searchInput = document.getElementById("searchInput");
        const productList = document.getElementById("productList");
        const noResultMessage = document.getElementById("noResultMessage");

        // Function to display products
        function displayProducts(filteredProducts) {
            productList.innerHTML = "";

            if (filteredProducts.length === 0) {
                noResultMessage.textContent = "No Results Found";
                return;
            }

            noResultMessage.textContent = "";

            filteredProducts.forEach(product => {
                const li = document.createElement("li");
                li.textContent = product;
                productList.appendChild(li);
            });
        }

        // Initial display
        displayProducts(products);

        // Search event
        searchInput.addEventListener("input", function () {
            const searchText = searchInput.value.toLowerCase();

            const filteredProducts = products.filter(product =>
                product.toLowerCase().includes(searchText)
            );

            displayProducts(filteredProducts);
        });

        // Event Delegation Example (Optional Click Handling)
        productList.addEventListener("click", function(event) {
            if (event.target.tagName === "LI") {
                alert("You selected: " + event.target.textContent);
            }
        });
    </script>

</body>
</html>
