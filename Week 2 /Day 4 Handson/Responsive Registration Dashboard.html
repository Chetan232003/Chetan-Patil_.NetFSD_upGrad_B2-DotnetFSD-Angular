<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration Dashboard</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">

    <h2 class="text-center mb-4">Training Institute Dashboard</h2>

    <div class="row g-4">

        <!-- Left Side - Registration Form -->
        <div class="col-lg-5 col-md-12">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="mb-3">Registration Form</h4>

                    <form>
                        <div class="mb-3">
                            <label class="form-label">Name</label>
                            <input type="text" class="form-control" placeholder="Enter Name" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Course</label>
                            <input type="text" class="form-control" placeholder="Enter Course" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="Enter Email" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Contact Number</label>
                            <input type="tel" class="form-control" placeholder="Enter Contact Number" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Register</button>
                    </form>

                </div>
            </div>
        </div>

        <!-- Right Side - Responsive Table -->
        <div class="col-lg-7 col-md-12">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="mb-3">Registered Users</h4>

                    <div class="table-responsive">
                        <table class="table table-striped table-bordered table-hover text-center align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th>Name</th>
                                    <th>Course</th>
                                    <th>Email</th>
                                    <th>Contact</th>
                                </tr>
                            </thead>
                            <tbody>

                                    <td>9876543210</td>
                                </tr>

                                    <td>priya@email.com</td>
                                    <td>9123456780</td>
                                </tr>
                                <tr>
                                    <td>Amit Verma</td>

                                    <td>amit@email.com</td>
                                    <td>9988776655</td>
                                </tr>

                                    <td>Web Development</td>
                                    <td>sneha@email.com</td>
                                    <td>9012345678</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>

                </div>
            </div>
        </div>

    </div>

</div>

</body>
</html>
