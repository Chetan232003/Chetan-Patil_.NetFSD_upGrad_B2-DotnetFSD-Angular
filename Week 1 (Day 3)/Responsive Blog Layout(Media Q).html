<!DOCTYPE html>
<html>
<head>
    <title>Responsive Blog Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 20px;
        }

        .card {
            background: white;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .card h3 {
            margin-top: 0;
        }

        .btn {
            display: inline-block;
            padding: 8px 12px;
            background: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn:hover {
            background: #0056b3;
        }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>My Blog</h1>
</header>

<div class="container">
    <div class="card">
        <h3>Blog Title 1</h3>
        <p>Short description of the blog post goes here.</p>
        <a href="#" class="btn">Read More</a>
    </div>

    <div class="card">
        <h3>Blog Title 2</h3>
        <p>Short description of the blog post goes here.</p>
        <a href="#" class="btn">Read More</a>
    </div>

    <div class="card">
        <h3>Blog Title 3</h3>
        <p>Short description of the blog post goes here.</p>
        <a href="#" class="btn">Read More</a>
    </div>
</div>

</body>
</html>
