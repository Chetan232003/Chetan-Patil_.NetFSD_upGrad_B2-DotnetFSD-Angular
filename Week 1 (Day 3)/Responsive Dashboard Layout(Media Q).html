<!DOCTYPE html>
<html>
<head>
    <title>Responsive Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .dashboard {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            background-color: #2c3e50;
            color: white;
            width: 220px;
            padding: 20px;
        }

        .sidebar h2 {
            margin-top: 0;
        }

        .sidebar ul {
            list-style: none;
            padding: 0;
        }

        .sidebar ul li {
            margin: 15px 0;
        }

        .sidebar ul li a {
            color: white;
            text-decoration: none;
        }

        .main {
            flex: 1;
            padding: 20px;
            background-color: #f4f4f4;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: white;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            flex: 1 1 30%;
        }

        @media (max-width: 768px) {
            .dashboard {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                text-align: center;
            }

            .cards {
                flex-direction: column;
            }

            .card {
                flex: 1 1 100%;
            }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <div class="sidebar">
        <h2>Dashboard</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Users</a></li>
            <li><a href="#">Reports</a></li>
            <li><a href="#">Settings</a></li>
        </ul>
    </div>

    <div class="main">
        <h1>Welcome Admin</h1>
        <div class="cards">
            <div class="card">
                <h3>Total Users</h3>
                <p>1500</p>
            </div>
            <div class="card">
                <h3>Sales</h3>
                <p>$12,000</p>
            </div>
            <div class="card">
                <h3>Performance</h3>
                <p>85%</p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
