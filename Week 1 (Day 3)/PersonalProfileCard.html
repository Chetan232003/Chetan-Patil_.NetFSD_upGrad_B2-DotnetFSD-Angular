<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Card</title>

    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f4f6f8;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .profile-card{
            background-color: #ffffff;
            width: 320px;
            padding: 25px;
            border: 1px solid #ddd;
            border-radius: 12px;
            text-align: center;
            margin: 20px;

        }
        .profile-card{
            margin: 0 0 10px;
            font-size: 26px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .role{
            color: #666;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .bio {
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #444;
        }

        .contact-btn {
            display: inline-block;
            padding: 10px 18px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 6px;
            font-size: 14px;
            transition: background-color 0.3s ease;
        }

        .contact-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    
<div class="profile-card">
    <h2>Chetan Patil</h2>
    <p class="role">Full Stack .Net Developer</p>
    <p class="bio">Passionate developer skilled in building scalable web applications.
                   Loves working with Asp.net, SQL, and modern web technologies.</p>
        <a href="#" class="contact-btn">Contact Me</a>

</div>


</body>
</html>
